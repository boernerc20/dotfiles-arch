# BEGIN WAL
[colors.primary]
background = '#0c111c'
foreground = '#c2c3c6'

[colors.cursor]
text   = '#0c111c' # Apply background color to color of text inside cursor
cursor = '#c2c3c6' # Apply foreground color to color of cursor

[colors.vi_mode_cursor]
text    = '#0c111c' # Same as above
cursor  = '#c2c3c6'

[colors.search.matches]
foreground = '#0c111c' # Same as above
background = '#c2c3c6' # Apply bright/white color to bg color of matching search

[colors.search.focused_match]
foreground = 'CellBackground'
background = 'CellForeground'

[colors.line_indicator]
foreground = 'None'
background = 'None'

[colors.footer_bar]
foreground = '#5b6170'
background = '#c2c3c6'

[colors.selection]
text       = 'CellBackground'
background = 'CellForeground'

[colors.normal]
black   = '#0c111c'
red     = '#9F4D6B'
green   = '#CC5A74'
yellow  = '#D76378'
blue    = '#5C6F8F'
magenta = '#A15A88'
cyan    = '#CE6694'
white   = '#c2c3c6'

[colors.bright]
black   = '#5b6170'
red     = '#9F4D6B'
green   = '#CC5A74'
yellow  = '#D76378'
blue    = '#5C6F8F'
magenta = '#A15A88'
cyan    = '#CE6694'
white   = '#c2c3c6'

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"
# END WAL