# 02-env.conf — environment variables and cursor settings
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Force NVIDIA GPU for rendering (not AMD iGPU)
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
# Pin the DRM device so a KVM-switch hotplug can't cause Aquamarine to latch
# onto the wrong card mid-rescan. Restored 2026-07-30 (was documented but absent).
env = AQ_DRM_DEVICES,/dev/dri/card1

# These two are X11/GLX-era variables and are inert under Wayland — VRR is
# controlled by the DRM VRR_ENABLED property (see misc:vrr below), not by these.
# Kept only because NVIDIA's own docs still reference them and they cost nothing.
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

env = QT_QPA_PLATFORMTHEME,qt6ct
# HYPRCURSOR_THEME omitted — Bibata hyprcursor set is missing text/ibeam shape
# Hyprland falls back to XCURSOR_THEME which has the full cursor set
env = HYPRSHOT_DIR,/home/chris/pics/screenshots
env = XCURSOR_THEME,Bibata-Modern-Classic-GTK
env = XCURSOR_SIZE,24
env = TERMINAL,kitty

cursor {
    enable_hyprcursor = false  # use XCURSOR_THEME — bibata hyprcursor missing text/ibeam
}
