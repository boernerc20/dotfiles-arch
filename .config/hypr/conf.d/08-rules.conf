# 08-rules.conf — window rules and wlogout layerrules
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = match:class ^(kitty)$, float on

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$

# Make surfshark act normal
windowrule = tile on, match:class ^(Surfshark)$

######################
### WLOGOUT CONFIG ###
######################

# Note: layerrule syntax changed in recent Hyprland updates
# Uncomment and adjust if needed for your version
# layerrule = blur,logout_dialog
# layerrule = ignorezero,logout_dialog
# layerrule = ignorealpha 0.5,logout_dialog

# Terminal transparency — single source of truth. Added 2026-07-31.
# kitty's own background_opacity is now 1.0; previously it was 0.92 and
# multiplied with decoration:inactive_opacity (0.9) to an effective 0.83 on
# unfocused terminals. Values here are active/inactive and are what actually
# lands on screen, so blur has a predictable amount of translucency to work with.
windowrule = opacity 0.92 0.85, match:class ^(kitty)$
