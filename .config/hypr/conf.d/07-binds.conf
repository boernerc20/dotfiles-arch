# 07-binds.conf — mainMod and all keybindings
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Main binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen

# Clipboard history picker
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -config ~/.config/rofi/colors-rofi.rasi -p "clipboard" | cliphist decode | wl-copy

# Color picker — copies the picked color as hex to the clipboard
bind = $mainMod, C, exec, hyprpicker -a

# Wallpaper picker
bind = $mainMod, W, exec, /home/chris/.local/bin/wallpaper-picker

# Commands for Power
# Power actions fire immediately. SHIFT is the only guard against a fat-finger,
# so these must stay on SHIFT — do not rebind them to bare $mainMod.
bind = $mainMod SHIFT, P, exec, systemctl poweroff
bind = $mainMod SHIFT, R, exec, systemctl reboot
bind = $mainMod SHIFT, L, exec, hyprctl dispatch exit
bind = $mainMod SHIFT, S, exec, systemctl suspend
# ---------------------------------------------------------------------------
# LOCK SCREEN — DISABLED AGAIN 2026-07-30 after a second lockout.
#
# Do NOT re-enable this without reading the whole note. Deferred to the LAST
# phase of the rework; the user is deliberately not prioritising locking.
#
# What actually happened (this is NOT the July 28 recursion bug — that one is
# genuinely fixed; the config parsed clean and hyprlock rendered fine):
#   23:38:25  pam_usb[2058465]  hyprlock  Access granted.
#   23:38:27  pam_usb[2059277]  hyprlock  Access granted.
# TWO hyprlock instances started 2 seconds apart. PAM authenticated BOTH
# successfully. The first owned the ext-session-lock; it died, and the
# survivor — despite authenticating — did not own the lock and so had nothing
# to release. Session stayed locked with no way in.
#
# The `pidof hyprlock ||` guard did NOT prevent this. It has a race window:
# hyprlock takes ~1s to appear in the process table, so two presses of
# SUPER+L inside that window both see "no hyprlock" and both launch.
#
# Recovery attempts that FAILED (do not waste time on them next round):
#   - misc:allow_session_lock_restore = 1 was armed. A fresh hyprlock launched
#     via `hyprctl dispatch exec hyprlock` did NOT adopt the orphaned lock.
#   - `loginctl unlock-session` is ignored by hyprlock by design.
#   - Hyprland exposes no force-unlock dispatcher.
# The ONLY way out was `hyprctl dispatch exit` (restart the compositor),
# which costs every open window.
#
# Before re-enabling, the fix must be a REAL mutex, not a pidof race — e.g. a
# wrapper using `flock` on a lockfile, so a double-press cannot ever spawn a
# second instance. Test it with a deliberate rapid double-press.
#
# bind = $mainMod, L, exec, pidof hyprlock || hyprlock
# ---------------------------------------------------------------------------

# Power menu
bind = $mainMod, X, exec, pkill wlogout || wlogout

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window with mainMod + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Wallpaper switching is now SUPER+W (rofi picker, all wallpapers).
# The old SUPER+CTRL+1..0 binds are gone: they were hardcoded to ten specific
# files and could not reach the other ~20 wallpapers in the directory.

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Media keys target Spotify exclusively
bindl = , XF86AudioNext, exec, playerctl -p spotify next
bindl = , XF86AudioPause, exec, playerctl -p spotify play-pause
bindl = , XF86AudioPlay, exec, playerctl -p spotify play-pause
bindl = , XF86AudioPrev, exec, playerctl -p spotify previous

# Screenshot a monitor
bind = $mainMod, PRINT, exec, hyprshot -m region
# Screenshot a region
bind = , PRINT, exec, hyprshot -m region --clipboard-only
# Screenshot a window
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m output

###############################
### LAYOUT CONTROL BINDINGS ###
###############################

# Layout switching
bind = $mainMod, O, exec, /home/chris/.local/bin/hypr-layout-preset master
bind = $mainMod SHIFT, O, exec, /home/chris/.local/bin/hypr-layout-preset dwindle

# Quick layout presets
bind = $mainMod, G, exec, /home/chris/.local/bin/hypr-layout-preset thirds         # G for Grid (3 columns)
bind = $mainMod, H, exec, /home/chris/.local/bin/hypr-layout-preset half           # H for Half (50/50)
bind = $mainMod, B, exec, /home/chris/.local/bin/hypr-layout-preset main-sidebar   # B for Big+small (66/33)
bind = $mainMod SHIFT, equal, exec, /home/chris/.local/bin/hypr-layout-preset reset  # Reset to equal sizes

# Window resizing (better control)
bind = $mainMod CTRL, left, resizeactive, -60 0
bind = $mainMod CTRL, right, resizeactive, 60 0
bind = $mainMod CTRL, up, resizeactive, 0 -60
bind = $mainMod CTRL, down, resizeactive, 0 60

# Preselect split direction (for precise window placement)
bind = $mainMod ALT, left, layoutmsg, preselect l   # Next window goes left
bind = $mainMod ALT, right, layoutmsg, preselect r  # Next window goes right
bind = $mainMod ALT, up, layoutmsg, preselect u     # Next window goes up
bind = $mainMod ALT, down, layoutmsg, preselect d   # Next window goes down

# Master layout controls (only work when in master layout)
bind = $mainMod, bracketleft, layoutmsg, addmaster        # Add a master window
bind = $mainMod, bracketright, layoutmsg, removemaster    # Remove a master window
bind = $mainMod, backslash, layoutmsg, swapwithmaster     # Swap focused window with master
bind = $mainMod, I, layoutmsg, orientationcycle left top  # Cycle master position
