# 07-binds.conf — mainMod and all keybindings
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Main binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen

# Clipboard history picker
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -config ~/.config/rofi/colors-rofi.rasi -p "clipboard" | cliphist decode | wl-copy

# Color picker — copies the picked color as hex to the clipboard
bind = $mainMod, C, exec, hyprpicker -a

# Wallpaper picker
bind = $mainMod, W, exec, /home/chris/.local/bin/wallpaper-picker

# Commands for Power
# Power actions fire immediately. SHIFT is the only guard against a fat-finger,
# so these must stay on SHIFT — do not rebind them to bare $mainMod.
bind = $mainMod SHIFT, P, exec, systemctl poweroff
bind = $mainMod SHIFT, R, exec, systemctl reboot
bind = $mainMod SHIFT, L, exec, hyprctl dispatch exit
bind = $mainMod SHIFT, S, exec, systemctl suspend
# ---------------------------------------------------------------------------
# LOCK SCREEN — re-enabled 2026-08-01, after two lockouts.
#
# It must stay routed through ~/.local/bin/lock. Do NOT "simplify" this to
# `exec, hyprlock`, and do NOT restore the old `pidof hyprlock ||` form.
#
# History, so the same fix is not undone by someone tidying up:
#
# 2026-07-28 — the wal template contained a `source` line pointing at its own
#   rendered output. Hyprlang recursed, hyprlock died holding the session lock.
#   Fixed: the template is self-contained, and `lock` asserts that on every run.
#
# 2026-07-30 — SUPER+L pressed twice quickly. PAM authenticated BOTH instances:
#     23:38:25  pam_usb[2058465]  hyprlock  Access granted.
#     23:38:27  pam_usb[2059277]  hyprlock  Access granted.
#   The first owned the ext-session-lock; it exited, and the survivor had
#   authenticated but owned nothing, so it had nothing to release.
#   `pidof hyprlock ||` did not stop it — hyprlock takes ~1s to appear in the
#   process table, so both presses read "not running". A check can never be
#   made atomic with the launch from shell; flock(2) is atomic by construction.
#
# Recovery paths that DID NOT work, so nobody re-tests them under pressure:
#   - misc:allow_session_lock_restore was already armed; a fresh hyprlock did
#     NOT adopt the orphaned lock while the second instance still held it.
#   - `loginctl unlock-session` is ignored by hyprlock by design.
#   - Hyprland exposes no force-unlock dispatcher.
# The only way out was `hyprctl dispatch exit`, which costs every open window.
# That is still what SUPER+SHIFT+L above does — it is the escape hatch.
bind = $mainMod, L, exec, /home/chris/.local/bin/lock
# ---------------------------------------------------------------------------

# Power menu
bind = $mainMod, X, exec, pkill wlogout || wlogout

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window with mainMod + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d 

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Wallpaper switching is now SUPER+W (rofi picker, all wallpapers).
# The old SUPER+CTRL+1..0 binds are gone: they were hardcoded to ten specific
# files and could not reach the other ~20 wallpapers in the directory.

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# Brightness dispatches through ~/.local/bin/brightness, which picks
# brightnessctl for a real laptop panel or DDC/CI (monitor-brightness) for an
# external display with no /sys/class/backlight entry — see that script's
# header. Whichever path it takes, `bind` NOT `bindel`: DDC/CI takes ~330ms per
# write, far slower than key repeat, so key repeat would queue commands the
# monitor drains one at a time and brightness would keep drifting after
# release. monitor-brightness also takes a non-blocking lock and drops
# overlapping presses as a second guard.
bind = ,XF86MonBrightnessUp, exec, /home/chris/.local/bin/brightness up
bind = ,XF86MonBrightnessDown, exec, /home/chris/.local/bin/brightness down

# Media keys target Spotify exclusively
bindl = , XF86AudioNext, exec, playerctl -p spotify next
bindl = , XF86AudioPause, exec, playerctl -p spotify play-pause
bindl = , XF86AudioPlay, exec, playerctl -p spotify play-pause
bindl = , XF86AudioPrev, exec, playerctl -p spotify previous

# Screenshot a monitor
bind = $mainMod, PRINT, exec, hyprshot -m region
# Screenshot a region
bind = , PRINT, exec, hyprshot -m region --clipboard-only
# Screenshot a window
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m output

###############################
### LAYOUT CONTROL BINDINGS ###
###############################

# Layout switching
bind = $mainMod, O, exec, /home/chris/.local/bin/hypr-layout-preset master
bind = $mainMod SHIFT, O, exec, /home/chris/.local/bin/hypr-layout-preset dwindle

# ── Quick layout presets ────────────────────────────────────────────────────
# The script sets WIDTHS only and lets dwindle own position/height; see the
# header of ~/.local/bin/hypr-layout-preset for why. A preset that needs more
# tiled windows than are present refuses and notifies rather than mangling the
# workspace, so these are all safe to mash.
#
# There used to be a second, "mnemonic" set here — SUPER+G/H/B and
# SUPER+SHIFT+equal — duplicating thirds/half/main-sidebar/reset. They were
# never used and burned four bare-SUPER keys, so they were removed 2026-08-04
# and those keys reassigned below. SUPER+ALT is now the ONLY layout-preset
# prefix, and every preset is reachable from it.

# Column-count binds: SUPER+ALT+<n> splits into n equal columns. SUPER+ALT is
# otherwise only used for preselect (arrows), so every digit here is free.
bind = $mainMod ALT, 1, exec, /home/chris/.local/bin/hypr-layout-preset max          # one window, full width
bind = $mainMod ALT, 2, exec, /home/chris/.local/bin/hypr-layout-preset half         # 50/50
bind = $mainMod ALT, 3, exec, /home/chris/.local/bin/hypr-layout-preset thirds       # 33/33/33
bind = $mainMod ALT, 4, exec, /home/chris/.local/bin/hypr-layout-preset quarters     # 25x4

# Asymmetric splits — the useful ones on a 3440px ultrawide, where equal columns
# are often too narrow for a browser and too wide for a terminal.
bind = $mainMod ALT, E, exec, /home/chris/.local/bin/hypr-layout-preset main-sidebar  # 66/33, main on the LEFT
bind = $mainMod ALT, R, exec, /home/chris/.local/bin/hypr-layout-preset sidebar-main # 33/66, main on the RIGHT
bind = $mainMod ALT, C, exec, /home/chris/.local/bin/hypr-layout-preset wide-center  # 25/50/25, focus in the middle
bind = $mainMod ALT, G, exec, /home/chris/.local/bin/hypr-layout-preset golden       # 62/38 golden ratio
bind = $mainMod ALT, 0, exec, /home/chris/.local/bin/hypr-layout-preset reset        # even out whatever is open

# Window resizing (better control)
bind = $mainMod CTRL, left, resizeactive, -60 0
bind = $mainMod CTRL, right, resizeactive, 60 0
bind = $mainMod CTRL, up, resizeactive, 0 -60
bind = $mainMod CTRL, down, resizeactive, 0 60

# Preselect split direction (for precise window placement)
bind = $mainMod ALT, left, layoutmsg, preselect l   # Next window goes left
bind = $mainMod ALT, right, layoutmsg, preselect r  # Next window goes right
bind = $mainMod ALT, up, layoutmsg, preselect u     # Next window goes up
bind = $mainMod ALT, down, layoutmsg, preselect d   # Next window goes down

# Master layout controls (only work when in master layout)
bind = $mainMod, bracketleft, layoutmsg, addmaster        # Add a master window
bind = $mainMod, bracketright, layoutmsg, removemaster    # Remove a master window
bind = $mainMod, backslash, layoutmsg, swapwithmaster     # Swap focused window with master
bind = $mainMod, I, layoutmsg, orientationcycle left top  # Cycle master position

##############################################
### KEYS FREED FROM THE OLD MNEMONIC BINDS ###
##############################################
# SUPER+G, SUPER+H, SUPER+B and SUPER+SHIFT+equal were duplicate layout presets
# that went unused. Reassigned 2026-08-04 to things this config genuinely had no
# key for. Each one is annotated with what it does, since none of them are
# guessable from the keycap alone.

# ── SUPER+B — scratchpad (special workspace) ────────────────────────────────
# A "hidden" workspace that overlays the current one and toggles away without
# disturbing window placement. Good for a terminal, notes, or a music player you
# want on every workspace without dedicating one to it.
#   SUPER+B          show/hide the scratchpad
#   SUPER+SHIFT+B    send the focused window INTO the scratchpad
# Note: a window moved here vanishes from the normal workspaces. SUPER+B is the
# only way back to it — if that feels like losing a window, this is why.
bind = $mainMod, B, togglespecialworkspace, scratch
bind = $mainMod SHIFT, B, movetoworkspacesilent, special:scratch

# ── SUPER+G — window groups (tabbed windows) ────────────────────────────────
# Groups stack windows into one tile with a tab bar, which is the practical way
# to use an ultrawide without slicing it into unreadably narrow columns.
#   SUPER+G          make/dissolve a group from the focused window
#   SUPER+SHIFT+G    pull the next window into the group / cycle tabs forward
# changegroupactive needs an existing group; it is a harmless no-op otherwise.
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, changegroupactive, f

# ── SUPER+H — pin the focused window ────────────────────────────────────────
# A pinned window follows you across every workspace. Only floating windows can
# be pinned (Hyprland ignores it on tiled ones), so this pairs with SUPER+T.
# Useful for a video or a reference doc you want visible while working elsewhere.
bind = $mainMod, H, pin

# ── SUPER+SHIFT+equal — dismiss notifications ───────────────────────────────
# mako runs as the notification daemon (installed 2026-07-28) but had no
# keybind, so a stuck or long-lived notification could only be waited out.
#   SUPER+SHIFT+equal   dismiss the topmost notification
#   SUPER+SHIFT+minus   dismiss ALL notifications
bind = $mainMod SHIFT, equal, exec, makoctl dismiss
bind = $mainMod SHIFT, minus, exec, makoctl dismiss --all
