# 01-monitors.conf — monitor definitions
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

monitor = DP-3, 3440x1440@120, 0x0, 1
# Fallback for any other/temporary output. The DisplayPort KVM switch causes real
# disconnects; without this, a transient reconnect can leave Hyprland with no valid
# monitor rule. Restored 2026-07-30 (was documented but absent).
# NOTE: the explicit 120 line above is load-bearing — this panel's EDID-preferred
# mode is only 59.97 Hz, so dropping it would silently land you at 60.
monitor = , preferred, auto, 1
