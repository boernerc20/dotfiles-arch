# 01-monitors.conf — monitor definitions
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# Generic fallback only. A machine's real monitor line — resolution, refresh
# rate, output name — belongs in ~/.config/hypr/hyprland-local.conf, which
# install.sh generates per machine and this repo does not track. This file
# stays shared across every machine because there's nothing machine-specific
# left in it once that line moves out.
#
# Without a fallback, a transient output disconnect (a KVM switch, a monitor
# waking up on a different port) can leave Hyprland with no valid monitor rule
# at all. `preferred` picks the EDID-preferred mode, which is not always the
# highest refresh rate — a machine that cares about that sets it explicitly in
# its local override, same as this fallback would need to if it tried.
monitor = , preferred, auto, 1
