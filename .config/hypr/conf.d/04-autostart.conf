# 04-autostart.conf — exec-once autostart entries
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
exec-once = mako
# Clipboard history — cliphist stores every copy; SUPER+V browses it via rofi.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# hypridle — idle lock, display-off, and lock-on-suspend.
#
# Disabled 2026-07-30 because its lock_cmd was `pidof hyprlock || hyprlock`,
# the racy form that caused that day's lockout. RE-ENABLED 2026-08-04 only
# after hypridle.conf was changed to call ~/.local/bin/lock, which holds a
# flock(2) mutex and cannot double-launch. Do not re-enable this line without
# checking that lock_cmd still points at the wrapper.
#
# This is also what locks the screen on suspend: hypridle's before_sleep_cmd
# runs `loginctl lock-session`. A systemd --user unit on sleep.target does NOT
# work as an alternative — sleep.target does not exist in the user manager on
# this system (verified: LoadState=not-found), so such a unit never fires.
exec-once = hypridle
# NOTE: `openrgb -p DEFAULT` loads a SAVED PROFILE, and this machine's saved
# profiles are stale — DEFAULT.orp/OFF.orp were written on the previous build
# and contain an MSI Z390 board and a QCK mousepad, with NO entry for the
# Kingston Fury DDR5 in this machine. That is why the RAM never went dark on
# suspend. Kept here because it still restores the GPU and mouse correctly;
# the JARGB headers are handled by msi-argb-refresh.timer, and sleep/resume is
# handled by ~/.local/bin/rgb-sleep, which uses direct commands instead.
exec-once = openrgb -p DEFAULT
# Start hyprpaper (empty config, IPC only)
exec-once = hyprpaper
# Load last wallpaper via IPC (handles symlinks correctly)
exec-once = sleep 1 && /home/chris/.local/bin/hyprpaper-load.sh
# Restore pywal colors to terminal
exec-once = sleep 0.5 && cat ~/.cache/wallust/sequences
# exec-once = udiskie --tray  # disabled — use hdd/uhdd aliases instead
