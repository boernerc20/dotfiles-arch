# 05-look.conf — look and feel: general, decoration, animations, dwindle, master, misc, xwayland
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(ff008dee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Tearing disabled 2026-07-30. It was only ever a consolation prize for VRR
    # being (incorrectly) believed unavailable — and it never did anything here
    # anyway, since tearing additionally requires per-window `windowrule = immediate`
    # rules and none were ever defined. With vrr = 2 now handling fullscreen
    # content, tearing is redundant.
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.01
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
    force_split = 2 # 0=follow mouse, 1=always left/top, 2=always right/bottom
    split_width_multiplier = 1.0
    smart_split = false
    smart_resizing = true
    default_split_ratio = 1.0
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master # New windows become master (or use "slave" for stack)
    new_on_top = true
    mfact = 0.60 # Master takes 60% of screen width
    orientation = left # Master on left, stack on right
    smart_resizing = true
    drop_at_cursor = true
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 to use hyprpaper wallpaper instead of default
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    # VRR enabled 2026-07-30. The previous "vrr_capable=0" note was wrong —
    # verified with `modetest -M nvidia-drm -c`, DP-3 reports vrr_capable=1.
    # The AW3418DW is a native hardware G-Sync module panel (EDID has an NVIDIA
    # VSDB, OUI 00-04-4B, and no FreeSync block). Such panels exposed no DRM VRR
    # at all until recent drivers, which is why the original reading was accurate
    # at the time; nvidia-open 610.43.03 now exposes it.
    #
    # Mode 2 = fullscreen-only, deliberately NOT 1 (always-on). Always-on VRR on
    # a G-Sync module panel causes visible brightness flicker on the desktop when
    # framerates swing. EDID VRR range is 30-120 Hz.
    vrr = 2
    # Re-enabled 2026-07-30. These were disabled to work around an Aquamarine
    # 0.10.0 crash; Aquamarine is now 0.13.0 so the workaround is stale. They
    # give the display a wake path independent of hypridle's on-resume — with
    # both disabled, a dead hypridle would leave the screen off with no way
    # back. If DPMS-related crashes return, set both to false and drop the
    # second listener in hypridle.conf.
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # Escape hatch: if the lock screen crashes, the compositor keeps the session
    # locked with no way in. This lets a fresh hyprlock take over an orphaned lock
    # instead of requiring a reboot. Added 2026-07-28 after exactly that lockout.
    allow_session_lock_restore = true
}

# Xwayland stability settings (prevent crashes)
xwayland {
    force_zero_scaling = true
}
