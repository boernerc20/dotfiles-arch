# 06-input.conf — input and per-device config
# Sourced from ~/.config/hypr/hyprland.conf. Do not source this file directly.

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
  
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    scroll_factor = 2.0

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
