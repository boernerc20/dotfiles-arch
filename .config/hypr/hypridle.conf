# hypridle — idle management daemon
#
# Escalation: 10 min -> lock, 15 min -> display off.
#
# SAFETY NOTES
# - lock_cmd MUST be ~/.local/bin/lock, never `hyprlock` and never the old
#   `pidof hyprlock || hyprlock`. That pidof form is what caused the 2026-07-30
#   lockout: hyprlock takes ~1s to appear in the process table, so two triggers
#   inside that window both read "not running" and both launch, PAM authenticates
#   both, and the instance that does not own the ext-session-lock has nothing to
#   release. hypridle was disabled that day for exactly this reason. The wrapper
#   holds a flock(2) mutex, which is atomic and cannot race.
# - NEVER `pkill hyprlock`. If the locker ever wedges, use the escape hatch:
#     hyprctl dispatch exec hyprlock
#   (over SSH if the screen is unusable — sshd and tailscale are both enabled).
#   misc:allow_session_lock_restore = true in hyprland.conf is what lets a
#   fresh hyprlock adopt an orphaned lock instead of forcing a reboot.
# - To disable the display-off behaviour, comment out the SECOND listener
#   block only. The lock listener is independent of it.

general {
    lock_cmd = /home/chris/.local/bin/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 10 minutes -> lock the session
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 minutes -> turn the display off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
