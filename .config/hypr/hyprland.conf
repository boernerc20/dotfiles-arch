# hyprland.conf — entry point only.
#
# Real configuration lives in ~/.config/hypr/conf.d/, sourced below. Modules are
# listed explicitly rather than globbed so load order stays deterministic: this
# config defines variables ($terminal, $mainMod, $p1...) that later modules
# depend on, and env must be set before autostart launches anything.
#
# Add a new module by creating conf.d/NN-name.conf and adding a source line here.
#
# Do not put a #### decorative block at the top of this or any sourced file —
# Hyprlang 0.6.x corrupts its parser state on a leading run of '#' characters.
#
# A pre-split copy of the old monolithic config is kept at
# ~/.config/hypr/hyprland.conf.pre-split

source = ~/.config/hypr/conf.d/01-monitors.conf
source = ~/.config/hypr/conf.d/02-env.conf
source = ~/.config/hypr/conf.d/03-programs.conf
source = ~/.config/hypr/conf.d/04-autostart.conf
source = ~/.config/hypr/conf.d/05-look.conf
source = ~/.config/hypr/conf.d/06-input.conf
source = ~/.config/hypr/conf.d/07-binds.conf
source = ~/.config/hypr/conf.d/08-rules.conf
source = ~/.config/hypr/conf.d/09-colors.conf
