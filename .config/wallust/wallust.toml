# wallust.toml — configuration for wallust, the pywal replacement.
#
# Verified against wallust 3.5.2. Check values with `wallust run --help`,
# which lists every accepted backend / colorspace / palette variant.
#
# ── Palette generation ──────────────────────────────────────────────
# These are deliberately CONSERVATIVE: the point of this migration is a
# like-for-like engine swap, so that if the colors shift you know it's the
# new engine and not a config choice. Experiment in Phase 6, not here.
#
# backend    = "wal"  : pywal's own imagemagick-based quantization, so the
#                       palette stays as close as possible to what pywal
#                       already produces for the same wallpaper.
# color_space = "lab" : CIE L*a*b, the closest analogue to pywal's behaviour.
# palette    = "dark" : 8 dark colors, dark background, light contrast.
#
# WORTH TRYING LATER (one-line change, Phase 6 material):
#   color_space = "salience" + palette = "saliencedark"
#     picks colors by visual salience (how much they pop from the background).
#     Variants tone it down if everything screams for attention:
#       saliencedarkbalanced     — sample the median salient colors
#       saliencedarkdistributed  — spread across the salient range
#       saliencedarklow          — sample the least salient
#     Any palette can be suffixed with 16 (e.g. saliencedark16) for the
#     "16 colors trick" instead of 8.
#
# NOTE: `palette` encodes BOTH strategy AND light/dark — there is no separate
# `style` key in 3.5.2. Writing `palette = "salience"` with `style = "dark"`
# is a v2/early-v3 schema and fails with "unknown variant `salience`".
backend = "wal"
color_space = "lab"
palette = "dark"

# Reject palettes with too little contrast between background and text
# colors — protects against an unreadable terminal/lockscreen on a
# low-contrast wallpaper.
check_contrast = true

# ── Templates ────────────────────────────────────────────────────────
# Every target below deliberately points into ~/.cache/wal/ using pywal's
# own filenames — NOT ~/.cache/wallust/. This is intentional: ~14 existing
# consumers (kitty, zshrc, waybar, rofi, wlogout, yazi, cava, nvim, qt6ct,
# firefox, neofetch, ~/.config/wal/postrun) already read those exact paths.
# Keeping the paths identical means the entire rest of the system needs
# zero changes for the pywal -> wallust swap. Do not "clean this up" by
# retargeting outputs to ~/.cache/wallust/ — that would silently break
# every one of those consumers.
#
# wallust's own terminal-sequence emission (~/.cache/wallust/sequences) is
# handled separately by wallust itself, not a template. Note this is the ONE
# path that is not pywal-compatible: pywal wrote ~/.cache/wal/sequences, and
# the consumer in conf.d/04-autostart.conf was repointed during the cutover.
#
# The wallust-switchover script that performed that cutover has been deleted —
# it existed to migrate off pywal with automatic rollback, and python-pywal was
# uninstalled on 2026-08-02, so there is nothing left to roll back to.

[templates]
# NOTE: there is deliberately no qt6ct template. ~/.config/wal/postrun computes
# and writes ~/.cache/wal/colors-qt6ct.conf itself, and wallust runs postrun
# AFTER rendering — so a template targeting that path was overwritten on every
# single run. Same for the rofi power/dark themes: nothing read their output.

colors_json = { template = "colors.json", target = "~/.cache/wal/colors.json" }
colors_sh = { template = "colors.sh", target = "~/.cache/wal/colors.sh" }
colors_kitty = { template = "colors-kitty.conf", target = "~/.cache/wal/colors-kitty.conf" }
colors_waybar = { template = "colors-waybar.css", target = "~/.cache/wal/colors-waybar.css" }
colors_css = { template = "colors.css", target = "~/.cache/wal/colors.css" }
colors_rofi = { template = "colors-rofi.rasi", target = "~/.cache/wal/colors-rofi.rasi" }
hyprlock = { template = "hyprlock.conf", target = "~/.cache/wal/hyprlock.conf" }
cava = { template = "config.cava", target = "~/.cache/wal/config.cava" }
yazi = { template = "yazi-theme.toml", target = "~/.cache/wal/yazi-theme.toml" }
nvim = { template = "colors-wal.vim", target = "~/.cache/wal/colors-wal.vim" }
mako = { template = "mako-config", target = "~/.cache/wal/mako-config" }
hypr_colors = { template = "hypr-colors.conf", target = "~/.cache/wal/hypr-colors.conf" }

# ── Hooks ────────────────────────────────────────────────────────────
# Reuse the existing pywal postrun script unchanged: it reads
# ~/.cache/wal/colors.json (still produced above) and handles Qt/Kvantum
# color-scheme generation, GTK (Thunar) CSS, and live kitty/GTK reload.
# wallust runs hooks after templates are rendered, same as pywal's postrun
# convention, so no changes to that script are needed.
[hooks]
postrun = "~/.config/wal/postrun"
