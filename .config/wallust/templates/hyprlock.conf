# hyprlock — GENERATED FILE. Do not edit directly.
# Source template: ~/.config/wallust/templates/hyprlock.conf
# Rendered by wallust to ~/.cache/wal/hyprlock.conf, then copied into place
# by ~/.local/bin/wal-hypr.sh on every wallpaper change.
#
# ############ SAFETY — READ BEFORE EDITING ############
# This file is deliberately SELF-CONTAINED. It contains NO `source` lines.
#
# The template this replaced (colors-hyprland.conf) contained the line
#   source = $HOME/.cache/wal/colors-hyprland.conf
# which pointed at its own rendered output. Hyprlang recursed on it, hyprlock
# died, and because Hyprland keeps a session locked when the lock client dies,
# it caused a full lockout on 2026-07-28.
#
# Rules that keep that from happening again:
#   1. NEVER add a `source` line to this template. ~/.local/bin/lock asserts
#      this before every lock and refuses if one appears.
#   2. NEVER launch hyprlock with `--config` pointing into ~/.cache/wal/.
#      Plain `hyprlock` reads ~/.config/hypr/hyprlock.conf, which is a real
#      file — so a corrupt or missing wal cache degrades to the last known
#      good config instead of locking you out.
#   3. NEVER `pkill hyprlock`. Use the escape hatch instead:
#      `hyprctl dispatch exec hyprlock` (over SSH if need be) adopts the
#      orphaned lock. misc:allow_session_lock_restore = true enables this.
#   4. ALWAYS lock via `lock`, never bare `hyprlock` — the wrapper holds the
#      flock mutex that stops a double-press spawning two instances.
# #####################################################

# NOTE ON COLOR FORMAT: Hyprlang does NOT accept pywal's bare `#RRGGBB`.
# It needs rgb(RRGGBB) / rgba(RRGGBBAA), so every color below uses the `strip`
# modifier (drops the '#') wrapped in rgb()/rgba(). A bare {{color0}} here
# yields `cannot parse "" as an int` at load time.
#
# PALETTE ROLES — these mirror waybar/style-base.css exactly, so the lock
# screen and the bar are recognisably the same system:
#   {{background}}  near-black plate      (waybar pill fill)
#   {{color4}}      primary accent        (waybar clock, distro, active workspace)
#   {{color6}}      secondary readouts    (waybar hardware, disk, mpris)
#   {{color8}}      recessed / muted text
#   {{foreground}}  primary text
#   {{color1}}      alert state           (waybar privacy, urgent, disconnected)
#
# This is a change from the previous template, which used {{color0}} for the
# background plate. color0 is a MID-GREY in this palette (#3D4043 on the
# current wallpaper), not the near-black the bar uses — so the old input field
# sat on a pale slab that matched nothing else on the desktop. wallust renders
# templates BEFORE ~/.config/wal/postrun clamps color0, which is why the two
# ever diverged.

general {
    hide_cursor = true

    # NO `grace` KEY HERE. hyprlock 0.9.6 has a --grace CLI flag but no
    # `general:grace` config option; adding one yields
    #     Config error ... config option <general:grace> does not exist
    # Validate any change to this file with:
    #     env -u WAYLAND_DISPLAY hyprlock --config ~/.config/hypr/hyprlock.conf
    # which prints every Hyprlang error and then aborts on "couldn't connect to
    # a wayland compositor" — it cannot lock anything, so it is safe to run
    # from inside a live session.

    # Enter on an empty field would otherwise be sent to PAM as a failed
    # attempt. /etc/pam.d/hyprlock tallies failures into faillock, which is
    # shared with sudo — so a few stray Enters could cost sudo access.
    ignore_empty_input = true
}

background {
    monitor =
    # Falls back to `color` if the symlink target is missing.
    path = $HOME/.current_wallpaper
    color = rgb({{background | strip}})

    blur_passes = 3
    blur_size = 6
    noise = 0.0140
    contrast = 1.4000
    # Darker than the old 0.75: the bar reads as lit instrumentation floating
    # over a dimmed image, and the lock screen only matches if the wallpaper
    # sits back the same way. It also keeps the accent glow legible on pale
    # wallpapers, which is where the bar's own contrast used to break down.
    brightness = 0.5500
    vibrancy = 0.2400
    vibrancy_darkness = 0.0
}

# ── HUD banner ───────────────────────────────────────────────────────────────
# Hyprlock has no letter-spacing, so the tracking is typed in. This is the same
# "instrument readout" cue the bar gets from CSS letter-spacing.
label {
    monitor =
    text = 󰌾   S Y S T E M   L O C K E D
    color = rgba({{color4 | strip}}cc)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 278
    halign = center
    valign = center
}

# ── Time ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgb({{foreground | strip}})
    font_size = 68
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba({{background | strip}}cc)
    position = 0, 185
    halign = center
    valign = center
}

# Thin accent rule under the clock — the lock-screen equivalent of the bright
# edge on each waybar pill.
shape {
    monitor =
    size = 460, 1
    color = rgba({{color4 | strip}}4d)
    rounding = 0
    border_size = 0
    position = 0, 115
    halign = center
    valign = center
}

# ── Date ─────────────────────────────────────────────────────────────────────
# Same dim/bright split and the same U+2502 divider as the waybar clock pill.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d │ %Y')"
    color = rgb({{color6 | strip}})
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, 72
    halign = center
    valign = center
}

# ── Password ─────────────────────────────────────────────────────────────────
# PASSWORD ONLY. pam_usb was removed from /etc/pam.d/hyprlock on 2026-08-01:
# it is `sufficient` and ran first, and the auth key lives permanently in the
# port, so hyprlock — which opens its PAM conversation as soon as it starts —
# was granted access before this field was ever drawn. The screen unlocked
# itself on 5 of 5 attempts. pam_usb is still used by sudo and su.
input-field {
    monitor =
    size = 360, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.62
    dots_center = true
    # The bar's pills are 4px/14px clipped corners; hyprlock takes a single
    # radius, so 10 is the closest read of that geometry.
    rounding = 10

    outer_color = rgba({{color4 | strip}}b3)
    inner_color = rgba({{background | strip}}d9)
    font_color = rgb({{foreground | strip}})
    check_color = rgba({{color6 | strip}}cc)
    fail_color = rgba({{color1 | strip}}cc)

    # color1 is the bar's alert hue (privacy capture, urgent workspace,
    # disconnected network). It is whatever the wallpaper yields and is NOT
    # reliably red — consistency with the rest of the desktop is doing the work
    # here, not colour symbolism, and the text itself says what happened.
    fail_text = <i>$FAIL — attempt $ATTEMPTS</i>
    capslock_color = rgba({{color3 | strip}}cc)

    fade_on_empty = false
    placeholder_text = <i>enter passphrase</i>
    position = 0, -20
    halign = center
    valign = center
}

# ── Identity ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "󰀄 $USER │ $(hostname)"
    color = rgba({{color8 | strip}}d9)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -115
    halign = center
    valign = center
}
