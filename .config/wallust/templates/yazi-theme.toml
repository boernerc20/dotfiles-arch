# Yazi Theme - Generated by pywal
# This file is automatically generated based on your wallpaper colors

[mgr]
# Border styles
cwd = { fg = "{{color7}}", bg = "{{background}}" }

# Hovered element
hovered = { fg = "{{background}}", bg = "{{color4}}" }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "{{color3}}", italic = true }
find_position = { fg = "{{color5}}", bg = "reset", italic = true }

# Marker
marker_selected = { fg = "{{color2}}", bg = "{{color2}}" }
marker_copied = { fg = "{{color3}}", bg = "{{color3}}" }
marker_cut = { fg = "{{color1}}", bg = "{{color1}}" }

# Tab
tab_active = { fg = "{{background}}", bg = "{{color4}}" }
tab_inactive = { fg = "{{color7}}", bg = "{{color0}}" }
tab_width = 1

# Count
count_copied = { fg = "{{background}}", bg = "{{color3}}" }
count_cut = { fg = "{{background}}", bg = "{{color1}}" }
count_selected = { fg = "{{background}}", bg = "{{color2}}" }

# Border
border_symbol = "│"
border_style = { fg = "{{color8}}" }

# Highlighting
syntect_theme = ""

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "{{color8}}", bg = "{{color8}}" }

# Mode
mode_normal = { fg = "{{background}}", bg = "{{color4}}", bold = true }
mode_select = { fg = "{{background}}", bg = "{{color3}}", bold = true }
mode_unset = { fg = "{{background}}", bg = "{{color1}}", bold = true }

# Progress
progress_label = { fg = "{{foreground}}", bold = true }
progress_normal = { fg = "{{color4}}", bg = "{{color8}}" }
progress_error = { fg = "{{color1}}", bg = "{{color8}}" }

# Permissions
permissions_t = { fg = "{{color2}}" }
permissions_r = { fg = "{{color3}}" }
permissions_w = { fg = "{{color1}}" }
permissions_x = { fg = "{{color4}}" }
permissions_s = { fg = "{{color8}}" }

[select]
border = { fg = "{{color4}}" }
active = { fg = "{{color5}}" }
inactive = { fg = "{{foreground}}" }

# Icons (customize based on your preferences)
[filetype]

rules = [
    # Special file types
    { url = "*", is = "link", fg = "{{color6}}" },
    { url = "*", is = "orphan", fg = "{{color1}}" },
    { url = "*", is = "exec", fg = "{{color2}}" },

    # Archives
    { url = "*.zip", fg = "{{color5}}" },
    { url = "*.tar", fg = "{{color5}}" },
    { url = "*.gz", fg = "{{color5}}" },
    { url = "*.7z", fg = "{{color5}}" },
    { url = "*.rar", fg = "{{color5}}" },

    # Images
    { url = "*.jpg", fg = "{{color3}}" },
    { url = "*.jpeg", fg = "{{color3}}" },
    { url = "*.png", fg = "{{color3}}" },
    { url = "*.gif", fg = "{{color3}}" },
    { url = "*.svg", fg = "{{color3}}" },
    { url = "*.webp", fg = "{{color3}}" },

    # Video
    { url = "*.mp4", fg = "{{color6}}" },
    { url = "*.mkv", fg = "{{color6}}" },
    { url = "*.avi", fg = "{{color6}}" },
    { url = "*.mov", fg = "{{color6}}" },

    # Audio
    { url = "*.mp3", fg = "{{color5}}" },
    { url = "*.flac", fg = "{{color5}}" },
    { url = "*.wav", fg = "{{color5}}" },
    { url = "*.ogg", fg = "{{color5}}" },

    # Documents
    { url = "*.pdf", fg = "{{color1}}" },
    { url = "*.doc", fg = "{{color4}}" },
    { url = "*.docx", fg = "{{color4}}" },

    # Code
    { url = "*.rs", fg = "{{color1}}" },
    { url = "*.py", fg = "{{color3}}" },
    { url = "*.sh", fg = "{{color2}}" },
    { url = "*.js", fg = "{{color3}}" },
    { url = "*.json", fg = "{{color3}}" },
    { url = "*.toml", fg = "{{color5}}" },
    { url = "*.yaml", fg = "{{color5}}" },
    { url = "*.yml", fg = "{{color5}}" },

    # Default fallback
    { url = "*", fg = "{{foreground}}" },
]

