# Hyprland palette colors — GENERATED by wallust from
# ~/.config/wallust/templates/hypr-colors.conf
#
# Rendered to ~/.cache/wal/hypr-colors.conf, then COPIED by
# ~/.local/bin/wal-hypr.sh to ~/.config/hypr/conf.d/09-colors.conf.
#
# ############ SAFETY ############
# This file contains NO `source` line and must never gain one. A wal template
# that sourced its own output path is what caused the 2026-07-28 lockout.
#
# It is COPIED to a real file under conf.d/ rather than sourced straight out of
# ~/.cache/wal/ on purpose: hyprland.conf sources conf.d/09-colors.conf
# unconditionally, so if the cache were ever missing or half-written, sourcing
# it directly would produce a config error on every reload. A real copy always
# holds the last known-good palette.
#
# Hyprland needs rgba(RRGGBBAA)/rgb(RRGGBB) — it rejects bare #RRGGBB with
# "cannot parse as an int" — hence the `strip` filter plus an explicit alpha.
# ###############################

general {
    # Active window: gradient from the primary accent to the secondary, at 45deg.
    col.active_border = rgba({{color4 | strip}}ee) rgba({{color6 | strip}}ee) 45deg
    # Inactive: muted, low alpha so unfocused windows recede.
    col.inactive_border = rgba({{color8 | strip}}80)
}

decoration {
    shadow {
        color = rgba({{background | strip}}ee)
    }
}

# Group/tab bar colors, used if window grouping is ever enabled.
group {
    col.border_active = rgba({{color4 | strip}}ee)
    col.border_inactive = rgba({{color8 | strip}}80)

    groupbar {
        col.active = rgba({{color4 | strip}}ee)
        col.inactive = rgba({{color8 | strip}}80)
    }
}
