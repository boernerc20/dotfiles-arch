# hyprlock — GENERATED FILE. Do not edit directly.
# Source template: ~/.config/wal/templates/hyprlock.conf
# Rendered by pywal to ~/.cache/wal/hyprlock.conf, then copied into place
# by ~/.local/bin/wal-hypr.sh on every wallpaper change.
#
# ############ SAFETY — READ BEFORE EDITING ############
# This file is deliberately SELF-CONTAINED. It contains NO `source` lines.
#
# The template this replaced (colors-hyprland.conf) contained the line
#   source = $HOME/.cache/wal/colors-hyprland.conf
# which pointed at its own rendered output. Hyprlang recursed on it, hyprlock
# died, and because Hyprland keeps a session locked when the lock client dies,
# it caused a full lockout on 2026-07-28.
#
# Rules that keep that from happening again:
#   1. NEVER add a `source` line to this template.
#   2. NEVER launch hyprlock with `--config` pointing into ~/.cache/wal/.
#      Plain `hyprlock` reads ~/.config/hypr/hyprlock.conf, which is a real
#      file — so a corrupt or missing wal cache degrades to the last known
#      good config instead of locking you out.
#   3. NEVER `pkill hyprlock`. Use the escape hatch instead:
#      `hyprctl dispatch exec hyprlock` (over SSH if need be) adopts the
#      orphaned lock. misc:allow_session_lock_restore = true enables this.
# #####################################################

# NOTE ON COLOR FORMAT: Hyprlang does NOT accept pywal's bare `#RRGGBB`.
# It needs rgb(RRGGBB) / rgba(RRGGBBAA), so every color below uses pywal's
# `.strip` modifier (drops the '#') wrapped in rgb()/rgba(). Using a bare
# {color0} here yields `cannot parse "" as an int` at load time.

general {{
    hide_cursor = true
}}

background {{
    monitor =
    # Falls back to `color` if the symlink target is missing.
    path = $HOME/.current_wallpaper
    color = rgb({color0.strip})

    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.7500
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}}

# Time
label {{
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgb({foreground.strip})
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 3
    shadow_size = 4
    position = 0, 160
    halign = center
    valign = center
}}

# Date
label {{
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgb({color7.strip})
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}}

# pam_usb is `sufficient` in /etc/pam.d/hyprlock and runs first, so an
# inserted USB key unlocks without typing. Absent the key, pam_unix takes
# this password field.
input-field {{
    monitor =
    size = 340, 55
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    rounding = 12
    outer_color = rgb({color1.strip})
    inner_color = rgba({color0.strip}d9)
    font_color = rgb({foreground.strip})
    fade_on_empty = false
    placeholder_text = <i>Password or USB key...</i>
    position = 0, -40
    halign = center
    valign = center
}}
