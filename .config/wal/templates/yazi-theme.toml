# Yazi Theme - Generated by pywal
# This file is automatically generated based on your wallpaper colors

[mgr]
# Border styles
cwd = {{ fg = "{color7}", bg = "{background}" }}

# Hovered element
hovered = {{ fg = "{background}", bg = "{color4}" }}
preview_hovered = {{ underline = true }}

# Find
find_keyword = {{ fg = "{color3}", italic = true }}
find_position = {{ fg = "{color5}", bg = "reset", italic = true }}

# Marker
marker_selected = {{ fg = "{color2}", bg = "{color2}" }}
marker_copied = {{ fg = "{color3}", bg = "{color3}" }}
marker_cut = {{ fg = "{color1}", bg = "{color1}" }}

# Tab
tab_active = {{ fg = "{background}", bg = "{color4}" }}
tab_inactive = {{ fg = "{color7}", bg = "{color0}" }}
tab_width = 1

# Count
count_copied = {{ fg = "{background}", bg = "{color3}" }}
count_cut = {{ fg = "{background}", bg = "{color1}" }}
count_selected = {{ fg = "{background}", bg = "{color2}" }}

# Border
border_symbol = "│"
border_style = {{ fg = "{color8}" }}

# Highlighting
syntect_theme = ""

[status]
separator_open = ""
separator_close = ""
separator_style = {{ fg = "{color8}", bg = "{color8}" }}

# Mode
mode_normal = {{ fg = "{background}", bg = "{color4}", bold = true }}
mode_select = {{ fg = "{background}", bg = "{color3}", bold = true }}
mode_unset = {{ fg = "{background}", bg = "{color1}", bold = true }}

# Progress
progress_label = {{ fg = "{foreground}", bold = true }}
progress_normal = {{ fg = "{color4}", bg = "{color8}" }}
progress_error = {{ fg = "{color1}", bg = "{color8}" }}

# Permissions
permissions_t = {{ fg = "{color2}" }}
permissions_r = {{ fg = "{color3}" }}
permissions_w = {{ fg = "{color1}" }}
permissions_x = {{ fg = "{color4}" }}
permissions_s = {{ fg = "{color8}" }}

[select]
border = {{ fg = "{color4}" }}
active = {{ fg = "{color5}" }}
inactive = {{ fg = "{foreground}" }}

# Icons (customize based on your preferences)
[filetype]

rules = [
    # Special file types
    {{ name = "*", is = "link", fg = "{color6}" }},
    {{ name = "*", is = "orphan", fg = "{color1}" }},
    {{ name = "*", is = "exec", fg = "{color2}" }},

    # Archives
    {{ name = "*.zip", fg = "{color5}" }},
    {{ name = "*.tar", fg = "{color5}" }},
    {{ name = "*.gz", fg = "{color5}" }},
    {{ name = "*.7z", fg = "{color5}" }},
    {{ name = "*.rar", fg = "{color5}" }},

    # Images
    {{ name = "*.jpg", fg = "{color3}" }},
    {{ name = "*.jpeg", fg = "{color3}" }},
    {{ name = "*.png", fg = "{color3}" }},
    {{ name = "*.gif", fg = "{color3}" }},
    {{ name = "*.svg", fg = "{color3}" }},
    {{ name = "*.webp", fg = "{color3}" }},

    # Video
    {{ name = "*.mp4", fg = "{color6}" }},
    {{ name = "*.mkv", fg = "{color6}" }},
    {{ name = "*.avi", fg = "{color6}" }},
    {{ name = "*.mov", fg = "{color6}" }},

    # Audio
    {{ name = "*.mp3", fg = "{color5}" }},
    {{ name = "*.flac", fg = "{color5}" }},
    {{ name = "*.wav", fg = "{color5}" }},
    {{ name = "*.ogg", fg = "{color5}" }},

    # Documents
    {{ name = "*.pdf", fg = "{color1}" }},
    {{ name = "*.doc", fg = "{color4}" }},
    {{ name = "*.docx", fg = "{color4}" }},

    # Code
    {{ name = "*.rs", fg = "{color1}" }},
    {{ name = "*.py", fg = "{color3}" }},
    {{ name = "*.sh", fg = "{color2}" }},
    {{ name = "*.js", fg = "{color3}" }},
    {{ name = "*.json", fg = "{color3}" }},
    {{ name = "*.toml", fg = "{color5}" }},
    {{ name = "*.yaml", fg = "{color5}" }},
    {{ name = "*.yml", fg = "{color5}" }},

    # Default fallback
    {{ name = "*", fg = "{foreground}" }},
]

[icons]
"Desktop/"     = ""
"Documents/"   = ""
"Downloads/"   = ""
"Pictures/"    = ""
"Music/"       = ""
"Videos/"      = ""
".config/"     = ""
".git/"        = ""
