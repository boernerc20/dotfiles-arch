# Point SSH_AUTH_SOCK at the systemd user unit `ssh-agent.socket`.
#
# Added 2026-07-31. Previously ~/.zshrc ran `eval $(ssh-agent -s)` from every
# shell. In an SSH login that placed ssh-agent inside session-N.scope, where it
# OUTLIVED the connection and pinned the logind session open in State=closing
# indefinitely. pam_usb cannot resolve a tty under Wayland, so it falls back to
# asking logind whether the user has a remote session -- a stale one makes it
# deny USB-key sudo permanently. A systemd *user* unit lives in the user manager
# scope instead, so it can never pin a login session.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
