# Kitty Configuration
# Pywal colors — auto-updated on wallpaper change
include ~/.cache/wal/colors-kitty.conf

# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Zoom keybinds (Ctrl+= / Ctrl+- / Ctrl+0)
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Window
window_padding_width    4
hide_window_decorations yes
# Opacity is owned by Hyprland, not kitty. Changed 2026-07-31.
# This used to be 0.92, which MULTIPLIED with Hyprland's inactive_opacity 0.9
# to give an effective 0.83 on unfocused terminals — two independent knobs
# compounding into a value neither of them named. Transparency now lives in
# exactly one place: the kitty windowrule in conf.d/08-rules.conf.
background_opacity      1.0
dynamic_background_opacity yes

# Cursor
cursor_shape           block
cursor_blink_interval  0

# Scrollback
scrollback_lines 10000

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Tab bar (hidden — use Hyprland workspaces instead)
tab_bar_style hidden

# URLs
url_style curly
open_url_with default

# Performance
sync_to_monitor yes
