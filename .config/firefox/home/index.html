<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>home</title>
  <link rel="icon" type="image/x-icon" href="icons/arch.png">

  <!-- Order matters: surfaces.css overrides colors.css, style.css consumes both.
       Both are symlinks into ~/.cache/wal/ and are rewritten on every wallpaper
       change by wal-hypr.sh.

       There is deliberately NO JS cache-buster here any more. It was a client
       -side patch for a server that sent no cache headers, it could never help
       the first paint, and it failed silently. serve.py now sends
       `Cache-Control: no-store`, which is the actual fix. -->
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="surfaces.css">
  <link rel="stylesheet" href="style.css">
  <script src="time.js"></script>
</head>

<body onload="realtimeClock()">

  <!-- Wallpaper backdrop. Its own element rather than a body background so the
       blur and dim can be applied without touching the content above it. The
       image comes from --wallpaper in colors.css, which wallust rewrites on
       every switch, so this is always the CURRENT wallpaper. -->
  <div class="backdrop" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="stage">

    <!-- HUD strip — same readout grammar as the waybar: dim label, bright
         value, U+2502 between fields. -->
    <div class="hud">
      <span class="hud-chip">
        <span class="dim">󰆍</span><span class="gap"></span>chris<span class="sep">│</span>workstation
      </span>
      <span class="hud-chip">
        <span class="dim">󰃭</span><span class="gap"></span><span id="date">&nbsp;</span>
      </span>
    </div>

    <section class="clockblock">
      <div class="time"><span id="clock">&nbsp;</span></div>
      <div class="rule"></div>
      <div class="greeting"><span id="greeting">Hello</span> Chris</div>
    </section>

    <form class="search" action="https://www.google.com/search" method="get" autocomplete="off">
      <span class="search-icon">󰍉</span>
      <input id="searchInput" class="search-input" type="text" name="q"
             placeholder="search" autocomplete="off" autofocus>
      <span class="search-hint">↵</span>
    </form>

    <nav class="grid">

      <section class="plate">
        <h2 class="plate-title"><span class="ico">󰇮</span>DAILY</h2>
        <ul>
          <li><a href="https://gmail.com"><span class="ico">󰇮</span>Gmail</a></li>
          <li><a href="https://chatgpt.com/"><span class="ico">󰚩</span>ChatGPT</a></li>
          <li><a href="https://amazon.com/"><span class="ico">󰄐</span>Amazon</a></li>
          <li><a href="https://linkedin.com"><span class="ico">󰌸</span>LinkedIn</a></li>
        </ul>
      </section>

      <section class="plate">
        <h2 class="plate-title"><span class="ico">󰊤</span>WORK</h2>
        <ul>
          <li><a href="https://github.com/"><span class="ico">󰊤</span>GitHub</a></li>
          <li><a href="https://calendar.google.com"><span class="ico">󰃭</span>Calendar</a></li>
          <li><a href="https://drive.google.com/"><span class="ico">󰋊</span>Drive</a></li>
          <li><a href="https://app.capacities.io/"><span class="ico">󰈙</span>Capacities</a></li>
        </ul>
      </section>

      <section class="plate">
        <h2 class="plate-title"><span class="ico">󰙯</span>SOCIAL</h2>
        <ul>
          <li><a href="https://reddit.com/"><span class="ico">󰔇</span>Reddit</a></li>
          <li><a href="https://instagram.com/"><span class="ico">󰋾</span>Instagram</a></li>
          <li><a href="https://outlook.office.com/"><span class="ico">󰞇</span>Outlook</a></li>
          <li><a href="https://discord.com/channels/@me"><span class="ico">󰙯</span>Discord</a></li>
        </ul>
      </section>

      <section class="plate">
        <h2 class="plate-title"><span class="ico">󰗃</span>MEDIA</h2>
        <ul>
          <li><a href="https://youtube.com/"><span class="ico">󰗃</span>YouTube</a></li>
          <li><a href="https://primevideo.com/"><span class="ico">󰘔</span>Prime Video</a></li>
          <li><a href="https://twitch.tv/"><span class="ico">󰠹</span>Twitch</a></li>
          <li><a href="https://netflix.com/"><span class="ico">󰝆</span>Netflix</a></li>
        </ul>
      </section>

    </nav>
  </main>

  <script>
    // Focus the search field. Firefox can steal focus back while the page is
    // still settling, so autofocus alone is not reliable for a homepage.
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('searchInput')?.focus({ preventScroll: true }), 100);
    });

    // Date line in the HUD, and a greeting that tracks the clock. Both are
    // rendered here rather than baked in so the page never shows a stale value
    // if it is left open across midnight.
    function paintDate() {
      const now = new Date();
      document.getElementById('date').textContent =
        now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' });
      const h = now.getHours();
      document.getElementById('greeting').textContent =
        h < 5 ? 'Still up,' : h < 12 ? 'Morning,' : h < 18 ? 'Afternoon,' : 'Evening,';
    }
    paintDate();
    setInterval(paintDate, 60000);
  </script>
</body>

</html>
