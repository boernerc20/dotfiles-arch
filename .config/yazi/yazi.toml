# Yazi Configuration
# Main config file for yazi file manager

[mgr]
# Layout configuration
ratio = [1, 4, 3]  # Sidebar, main view, preview ratios
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = true
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5

[preview]
wrap = "no"
tab_size = 2
max_width = 1200
max_height = 900
image_filter = "lanczos3"
image_quality = 80
cache_dir = ""

[opener]
edit = [
    { run = 'micro "$@"; clear', block = true, desc = "Edit with micro" },
]
view = [
    { run = 'qimgv "$@" >/dev/null 2>&1; kill -WINCH $PPID', desc = "View image" },
]
play = [
    { run = 'mpv "$@" >/dev/null 2>&1; kill -WINCH $PPID', desc = "Play media" },
]
pdf = [
    { run = 'zathura "$@" >/dev/null 2>&1; kill -WINCH $PPID', desc = "Open PDF" },
]
extract = [
    { run = 'unar "$@"', desc = "Extract archive" },
]
open = [
    { run = 'xdg-open "$@"', orphan = true, desc = "Open with default app" },
]

[open]
# MIME type rules - map file types to openers
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/xml", use = "edit" },
    { mime = "application/javascript", use = "edit" },
    { mime = "application/x-python", use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { mime = "application/toml", use = "edit" },
    { mime = "application/x-yaml", use = "edit" },
    { mime = "application/x-wine-extension-ini", use = "edit" },
    { mime = "image/*", use = "view" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
    { mime = "inode/directory", use = "open" },
    { mime = "application/json", use = "edit" },
    { mime = "application/pdf", use = "pdf" },
    { mime = "*", use = "open" },
]

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false

[plugin]
# Plugin configuration
prepend_fetchers = []
prepend_preloaders = []
prepend_previewers = []
append_fetchers = []
append_preloaders = []
append_previewers = []

[input]
# Cursor movement
cursor_blink = true

[select]
# Selection mode settings
open_title = "Open with:"
open_origin = "top-center"
open_offset = [0, 2, 50, 7]

[which]
# Which-key style keybinding hints
sort_by = "none"
sort_sensitive = false
sort_reverse = false

[log]
enabled = false
