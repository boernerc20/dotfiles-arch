# Yazi Keybindings
# Optimized for efficient file management in Hyprland

[mgr]
# Navigation
prepend_keymap = [
    # Core movement
    { on = ["h"], run = "leave", desc = "Go to parent directory" },
    { on = ["l"], run = "enter", desc = "Enter directory" },
    { on = ["j"], run = "arrow 1", desc = "Move down" },
    { on = ["k"], run = "arrow -1", desc = "Move up" },

    # Fast navigation
    { on = ["g", "g"], run = "arrow -999999", desc = "Go to top" },
    { on = ["G"], run = "arrow 999999", desc = "Go to bottom" },
    { on = ["<C-u>"], run = "arrow -50%", desc = "Page up" },
    { on = ["<C-d>"], run = "arrow 50%", desc = "Page down" },

    # Search and filter
    { on = ["/"], run = "search fd", desc = "Find files with fd" },
    { on = ["?"], run = "search rg", desc = "Search content with ripgrep" },
    { on = ["f"], run = "filter", desc = "Filter files" },
    { on = ["z"], run = "plugin zoxide", desc = "Jump with zoxide" },
    { on = ["Z"], run = "plugin fzf", desc = "Jump with fzf" },

    # Selection
    { on = ["<Space>"], run = ["select --state=none", "arrow 1"], desc = "Toggle selection and move down" },
    { on = ["v"], run = "visual_mode", desc = "Enter visual mode" },
    { on = ["V"], run = "visual_mode --unset", desc = "Exit visual mode" },
    { on = ["<C-a>"], run = "select_all --state=true", desc = "Select all" },
    { on = ["<C-r>"], run = "select_all --state=none", desc = "Inverse selection" },
    { on = ["<Esc>"], run = ["visual_mode --unset", "select_all --state=none", "unyank"], desc = "Exit visual mode and clear selections" },

    # File operations
    { on = ["o"], run = "open", desc = "Open file" },
    { on = ["O"], run = "open --interactive", desc = "Open with..." },
    { on = ["c"], run = "yank", desc = "Copy selected files" },
    { on = ["x"], run = "yank --cut", desc = "Cut selected files" },
    { on = ["p"], run = "paste", desc = "Paste files" },
    { on = ["P"], run = "paste --force", desc = "Paste (overwrite)" },
    { on = ["d"], run = "remove", desc = "Delete files" },
    { on = ["D"], run = "remove --permanently", desc = "Delete permanently" },
    { on = ["a"], run = "create", desc = "Create file/directory" },
    { on = ["r"], run = "rename", desc = "Rename file" },
    { on = [";"], run = "shell", desc = "Run shell command" },
    { on = [":"], run = "shell --block", desc = "Run shell (blocking)" },

    # Directory operations
    { on = ["m"], run = "linemode none", desc = "Set linemode to none" },
    { on = ["m", "s"], run = "linemode size", desc = "Set linemode to size" },
    { on = ["m", "p"], run = "linemode permissions", desc = "Set linemode to permissions" },
    { on = ["m", "m"], run = "linemode mtime", desc = "Set linemode to modified time" },

    # View settings
    { on = ["."], run = "hidden toggle", desc = "Toggle hidden files" },
    { on = ["s"], run = "search fd", desc = "Search files" },
    { on = ["S"], run = "sort --transient", desc = "Sort by..." },

    # System integration
    { on = ["~"], run = "shell --block 'dragon-drop -x -a \"$@\"' --confirm", desc = "Drag and drop" },
    { on = ["<Enter>"], run = "open", desc = "Open file" },
    { on = ["<C-s>"], run = "search none", desc = "Cancel search" },
    { on = ["<C-l>"], run = "shell --block 'clear'", desc = "Clear and redraw screen" },

    # Bookmarks (go to common directories)
    { on = ["g", "h"], run = "cd ~", desc = "Go to home" },
    { on = ["g", "c"], run = "cd ~/.config", desc = "Go to .config" },
    { on = ["g", "D"], run = "cd ~/downloads", desc = "Go to downloads" },
    { on = ["g", "d"], run = "cd ~/docs", desc = "Go to docs" },
    { on = ["g", "p"], run = "cd ~/projects", desc = "Go to projects" },
    { on = ["g", "P"], run = "cd ~/pics", desc = "Go to pics"},
    { on = ["g", "t"], run = "cd ~/.local/share/Trash", desc = "Go to trash" },
    { on = ["g", "r"], run = "cd /", desc = "Go to root" },
    { on = ["g", "g"], run = "cd ~/games", desc = "Go to games"},
    { on = ["g", "v"], run = "cd ~/videos", desc = "Go to videos"},
    { on = ["g", "a"], run = "cd /mnt/ai", desc = "Go to ai" },
    { on = ["g", "o"], run = "cd /mnt/ai/comfy/ComfyUI/output/projects", desc = "Go to outputs" },

    # Quit
    { on = ["q"], run = "quit", desc = "Quit yazi" },
    { on = ["Q"], run = "quit --no-cwd-file", desc = "Quit without saving cwd" },

    # Tabs
    { on = ["t"], run = "tab_create --current", desc = "New tab" },
    { on = ["1"], run = "tab_switch 0", desc = "Switch to tab 1" },
    { on = ["2"], run = "tab_switch 1", desc = "Switch to tab 2" },
    { on = ["3"], run = "tab_switch 2", desc = "Switch to tab 3" },
    { on = ["4"], run = "tab_switch 3", desc = "Switch to tab 4" },
    { on = ["5"], run = "tab_switch 4", desc = "Switch to tab 5" },
    { on = ["["], run = "tab_switch -1 --relative", desc = "Previous tab" },
    { on = ["]"], run = "tab_switch 1 --relative", desc = "Next tab" },
    { on = ["{"], run = "tab_swap -1", desc = "Swap tab left" },
    { on = ["}"], run = "tab_swap 1", desc = "Swap tab right" },

    # Copy paths to clipboard
    { on = ["y", "y"], run = "copy path", desc = "Copy absolute path" },
    { on = ["y", "d"], run = "copy dirname", desc = "Copy directory path" },
    { on = ["y", "f"], run = "copy filename", desc = "Copy filename" },
    { on = ["y", "n"], run = "copy name_without_ext", desc = "Copy name without extension" },
]

[tasks]
prepend_keymap = [
    { on = ["j"], run = "arrow 1", desc = "Move down" },
    { on = ["k"], run = "arrow -1", desc = "Move up" },
    { on = ["<Enter>"], run = "inspect", desc = "Inspect task" },
    { on = ["x"], run = "cancel", desc = "Cancel task" },
    { on = ["q"], run = "close", desc = "Close task manager" },
]

[select]
prepend_keymap = [
    { on = ["j"], run = "arrow 1", desc = "Move down" },
    { on = ["k"], run = "arrow -1", desc = "Move up" },
    { on = ["<Enter>"], run = "close --submit", desc = "Submit" },
    { on = ["<Esc>"], run = "close", desc = "Cancel" },
    { on = ["q"], run = "close", desc = "Cancel" },
]

[input]
prepend_keymap = [
    { on = ["<Esc>"], run = "close", desc = "Cancel input" },
    { on = ["<Enter>"], run = "close --submit", desc = "Submit input" },
    { on = ["<C-c>"], run = "close", desc = "Cancel input" },
]

[completion]
prepend_keymap = [
    { on = ["j"], run = "arrow 1", desc = "Move down" },
    { on = ["k"], run = "arrow -1", desc = "Move up" },
    { on = ["<Enter>"], run = "close --submit", desc = "Submit" },
    { on = ["<Tab>"], run = "close --submit", desc = "Submit" },
    { on = ["<Esc>"], run = "close", desc = "Cancel" },
]

[help]
prepend_keymap = [
    { on = ["j"], run = "arrow 1", desc = "Move down" },
    { on = ["k"], run = "arrow -1", desc = "Move up" },
    { on = ["q"], run = "close", desc = "Close help" },
    { on = ["<Esc>"], run = "close", desc = "Close help" },
]
