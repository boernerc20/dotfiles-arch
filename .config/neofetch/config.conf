# ── Info Layout ──────────────────────────────────────────────────────────────
print_info() {
    info " ​ ​ " title
    prin "┌───────────────────────────────┐"
    info " ​ ​󰌢 " model
    info " ​ ​󰍛 " cpu
    info " ​ ​󰘚 " gpu
    info " ​ ​ " disk
    info " ​ ​󰑭 " memory
    info " ​ ​󰍹 " resolution
#    info " ​ ​ 󱈑 " battery
    prin "├───────────────────────────────┤"
#    info " ​ ​  " users
    info " ​ ​ " distro
    info " ​ ​ " kernel
#    info " ​ ​  " de
#    info "  " wm
    info " ​ ​ " shell
    info " ​ ​ " term
#    info " ​ ​ │  " font
#    info " ​ ​  󰉼 " theme
#    info " ​ ​  󰀻 " icons
    info " ​ ​󰊠 " packages 
    info " ​ ​󰅐 " uptime
#    info " ​ ​   " gpu_driver  # Linux/macOS only
#    info " ​ ​  " cpu_usage
#    info " ​ ​ 󰝚 " song
    # [[ "$player" ]] && prin "Music Player" "$player"
#    info " ​ ​   " local_ip
#    info " ​ ​   " public_ip
#    info " ​ ​   " locale  # This only works on glibc systems.
    prin "└───────────────────────────────┘"
    info cols
    prin "\n \n ${cl3} \n \n ${cl5} \n \n ${cl2} \n \n ${cl6}  \n \n ${cl4}  \n \n ${cl1}  \n \n ${cl7}  \n \n ${cl0}"
}

# ── General ──────────────────────────────────────────────────────────────────
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="tiny"

# ── Memory ───────────────────────────────────────────────────────────────────
memory_percent="on"
memory_unit="mib"

# ── Packages ─────────────────────────────────────────────────────────────────
package_managers="tiny"

# ── Shell ────────────────────────────────────────────────────────────────────
shell_path="off"
shell_version="on"

# ── CPU ──────────────────────────────────────────────────────────────────────
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="off"
cpu_temp="off"

# ── GPU ──────────────────────────────────────────────────────────────────────
gpu_brand="on"
gpu_type="dedicated"

# ── Resolution ───────────────────────────────────────────────────────────────
refresh_rate="on"

# ── GTK / Themes ─────────────────────────────────────────────────────────────
gtk_shorthand="off"
gtk2="on"
gtk3="on"

# ── Disk ─────────────────────────────────────────────────────────────────────
disk_show=('/')
disk_subtitle="none"
disk_percent="on"
disk_display="off"

# ── Colors & Style ───────────────────────────────────────────────────────────
colors=(4 2 1 3 5 6)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
block_range=(0 15)
color_blocks="dots"
block_width=3
block_height=1
col_offset="auto"

# ── Progress Bars ────────────────────────────────────────────────────────────
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=20
bar_color_elapsed="distro"
bar_color_total="distro"

# ── Image / ASCII ────────────────────────────────────────────────────────────
image_backend="ascii"
image_source="$HOME/.config/neofetch/myascii.txt"
ascii_colors=(4 6 2)
ascii_bold="on"
gap=0
crop_mode="normal"
crop_offset="center"
image_size="auto"

# ── Misc ─────────────────────────────────────────────────────────────────────
stdout="off"
magenta="\033[1;35m"
green="\033[1;32m"
white="\033[1;37m"
blue="\033[1;34m"
red="\033[1;31m"
black="\033[1;40;30m"
yellow="\033[1;33m"
cyan="\033[1;36m"
reset="\033[0m"
bgyellow="\033[1;43;33m"
bgwhite="\033[1;47;37m"
cl0="${reset}"
cl1="${magenta}"
cl2="${green}"
cl3="${white}"
cl4="${blue}"
cl5="${red}"
cl6="${yellow}"
cl7="${cyan}"
cl8="${black}"
cl9="${bgyellow}"
cl10="${bgwhite}"
